<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice HD (Debug Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Styles --- */
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; min-height: 100vh; }
        .container { max-width: 800px; margin: 10px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Debug Console (กล่องดำสำหรับจับ Error) */
        #debugConsole { 
            background: #000; color: #0f0; font-family: monospace; 
            padding: 10px; margin: 10px; border-radius: 5px; 
            min-height: 50px; font-size: 12px; white-space: pre-wrap; word-wrap: break-word;
        }

        .btn { padding: 15px; width: 100%; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-part { background: #fff; border: 2px solid #007bff; color: #007bff; }
        .btn-part:active { background: #007bff; color: white; }
        
        #examPage { display: none; padding-top: 20px; border-top: 2px solid #eee; }
        .input-box { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 15px; box-sizing: border-box; }
        
        /* Loading Overlay */
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; font-size: 1.2em; color: #007bff;
        }
    </style>
</head>
<body>

    <div id="debugConsole">System Log initializing...</div>

    <div id="loadingScreen">
        <div>⏳ กำลังโหลดระบบ...</div>
        <div style="font-size: 0.8em; color: #666; margin-top: 10px;">กรุณารอสักครู่</div>
    </div>

    <div class="container">
        <h2 style="text-align:center; color:#007bff;">Voice HD (Diagnostic)</h2>
        
        <div id="setupPage">
            <p>1. ชื่อของคุณ:</p>
            <input type="text" id="uName" class="input-box" placeholder="พิมพ์ชื่อทดสอบที่นี่...">
            
            <p>2. เลือก Part เพื่อเริ่ม:</p>
            <button class="btn btn-part" id="btnP1">เข้าทำแบบทดสอบ Part 1</button>
            <button class="btn btn-part" id="btnP2">เข้าทำแบบทดสอบ Part 2</button>
            <button class="btn btn-part" id="btnP3">เข้าทำแบบทดสอบ Part 3</button>
        </div>

        <div id="examPage">
            <h3 id="qHeader">คำถาม Part 1</h3>
            <div style="background:#e3f2fd; padding:15px; border-radius:5px; margin-bottom:15px;">
                <strong>ถาม:</strong> <span id="qText">...</span>
            </div>
            
            <button class="btn" style="background:#28a745; color:white;" id="btnRec">🎙️ ลองกดอัดเสียง (Test Mic)</button>
            <button class="btn" style="background:#dc3545; color:white;" id="btnStop" disabled>⏹️ หยุดอัด</button>
            
            <div id="audioBox" style="margin-top:15px; display:none;">
                <audio id="audioPlayer" controls style="width:100%"></audio>
                <p style="color:green; text-align:center;">บันทึกสำเร็จ! (iOS Compatible)</p>
            </div>
            
            <button class="btn" style="background:#6c757d; color:white; margin-top:20px;" onclick="location.reload()">🔄 รีเฟรชเพื่อเริ่มใหม่</button>
        </div>
    </div>

    <script>
        // --- 1. ระบบดักจับ Error (สำคัญที่สุด) ---
        const debugBox = document.getElementById('debugConsole');
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            debugBox.innerHTML += `\n[${time}] ${msg}`;
            console.log(msg);
        }
        
        window.onerror = function(message, source, lineno, colno, error) {
            log(`❌ ERROR: ${message} (Line: ${lineno})`);
            document.getElementById('loadingScreen').style.display = 'none'; // ปิด Loading ให้เห็น Error
            return false;
        };

        // --- 2. ข้อมูลคำถาม (Hardcode เพื่อความชัวร์) ---
        const DB = {
            part1: [ { q: "ทดสอบ Part 1 ข้อที่ 1: สวัสดีครับ สนใจรับฟังข้อมูลไหม?", a: "แนวทางตอบ..." } ],
            part2: [ { q: "ทดสอบ Part 2 ข้อที่ 1: เรื่องโรคประจำตัว?", a: "แนวทางตอบ..." } ],
            part3: [ { q: "ทดสอบ Part 3 ข้อที่ 1: ขอคิดดูก่อน?", a: "แนวทางตอบ..." } ]
        };

        // --- 3. ตัวแปรระบบ ---
        let mediaRecorder;
        let audioChunks = [];
        
        // --- 4. ฟังก์ชันการทำงาน ---
        document.addEventListener('DOMContentLoaded', () => {
            log("DOM Loaded.");
            
            // ซ่อน Loading Screen เมื่อโหลดเสร็จ
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                log("System Ready. Please enter name and select Part.");
            }, 1000);

            // ผูกปุ่มกด (Event Listeners)
            document.getElementById('btnP1').addEventListener('click', () => startExam('part1'));
            document.getElementById('btnP2').addEventListener('click', () => startExam('part2'));
            document.getElementById('btnP3').addEventListener('click', () => startExam('part3'));
            
            document.getElementById('btnRec').addEventListener('click', startRec);
            document.getElementById('btnStop').addEventListener('click', stopRec);
        });

        function startExam(part) {
            log(`Button Clicked: ${part}`);
            
            const name = document.getElementById('uName').value;
            // *BYPASS: ไม่บังคับกรอกชื่อ เพื่อเทสว่าปุ่มทำงานไหม*
            if(!name) log("⚠️ Warning: No name entered (Test mode)");

            try {
                // ซ่อนหน้าแรก โชว์หน้าสอบ
                document.getElementById('setupPage').style.display = 'none';
                document.getElementById('examPage').style.display = 'block';
                
                // โหลดคำถาม
                const data = DB[part][0];
                document.getElementById('qHeader').innerText = `แบบทดสอบ ${part.toUpperCase()}`;
                document.getElementById('qText').innerText = data.q;
                
                log(`Exam started: ${part}`);
            } catch (e) {
                log(`❌ Start Failed: ${e.message}`);
            }
        }

        async function startRec() {
            log("Attempting to record...");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log("Microphone Access Granted.");

                // iOS Fix: No options
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    log("Recording stopped. Creating Blob...");
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp4' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = document.getElementById('audioPlayer');
                    audio.src = audioUrl;
                    document.getElementById('audioBox').style.display = 'block';
                    log("Audio Blob created (audio/mp4)");
                };

                mediaRecorder.start();
                log("MediaRecorder Started.");
                
                document.getElementById('btnRec').disabled = true;
                document.getElementById('btnStop').disabled = false;
                document.getElementById('btnStop').style.background = '#dc3545'; // Red color active

            } catch (err) {
                log(`❌ Mic Error: ${err.name} - ${err.message}`);
                alert("ไมโครโฟนใช้งานไม่ได้: " + err.message + "\n(บน iPhone ต้องใช้ Safari และเปิดผ่าน HTTPS เท่านั้น)");
            }
        }

        function stopRec() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                log("Stopping recorder...");
                document.getElementById('btnRec').disabled = false;
                document.getElementById('btnStop').disabled = true;
            }
        }
    </script>
</body>
</html>
