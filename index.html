<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Check</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #333; color: white; }
        .box { background: #444; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #555; }
        h3 { margin-top: 0; color: #ffd700; border-bottom: 1px solid #666; padding-bottom: 5px; }
        .status { font-weight: bold; margin-left: 10px; }
        .pass { color: #0f0; }
        .fail { color: #f00; }
        .wait { color: #aaa; }
        button { padding: 10px 20px; font-size: 16px; width: 100%; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🛠️ หน้าจอตรวจสอบระบบ</h2>
    <p>กรุณาแคปหน้านี้ส่งมาให้ดูครับ</p>

    <div class="box">
        <h3>1. ตรวจสอบ JavaScript</h3>
        - JS Running: <span id="s1" class="wait">...</span>
    </div>

    <div class="box">
        <h3>2. ตรวจสอบ Supabase (ฐานข้อมูล)</h3>
        - Library Loaded: <span id="s2" class="wait">...</span><br>
        - Connection: <span id="s2b" class="wait">...</span>
    </div>

    <div class="box">
        <h3>3. ตรวจสอบการอัดเสียง (สำคัญ)</h3>
        - Browser: <span id="s3a">...</span><br>
        - MediaRecorder: <span id="s3b" class="wait">...</span><br>
        <button onclick="testMic()">กดปุ่มนี้เพื่อทดสอบไมค์</button>
        <div id="micResult" style="margin-top:5px; color:#aaa;">(รอผลการกดปุ่ม)</div>
    </div>

    <div class="box">
        <h3>Console Log (ข้อความจากระบบ)</h3>
        <div id="logs" style="font-size:12px; font-family:monospace; color:#ccc;"></div>
    </div>

    <script>
        // ฟังก์ชันเขียน Log
        function log(msg) {
            document.getElementById('logs').innerHTML += `> ${msg}<br>`;
        }

        // 1. เช็ค JS
        document.getElementById('s1').innerText = "✅ ทำงานปกติ";
        document.getElementById('s1').className = "pass";
        log("JS Started");

        // 2. เช็ค Supabase
        window.onload = function() {
            log("Window Loaded");
            
            // เช็ค Library
            if (typeof supabase !== 'undefined' || typeof createClient !== 'undefined') {
                document.getElementById('s2').innerHTML = "✅ โหลดสำเร็จ";
                document.getElementById('s2').className = "pass";
            } else {
                document.getElementById('s2').innerHTML = "❌ โหลดไม่ผ่าน (เน็ตอาจบล็อก)";
                document.getElementById('s2').className = "fail";
            }

            // เช็ค Browser Info
            document.getElementById('s3a').innerText = navigator.userAgent.slice(0, 50) + "...";

            // เช็ค MediaRecorder (ตัวอัดเสียง)
            if (window.MediaRecorder) {
                document.getElementById('s3b').innerHTML = "✅ รองรับ (Supported)";
                document.getElementById('s3b').className = "pass";
            } else {
                document.getElementById('s3b').innerHTML = "❌ ไม่รองรับ (iOS เก่าไป?)";
                document.getElementById('s3b').className = "fail";
            }
        };

        // ฟังก์ชันเทสไมค์
        async function testMic() {
            const res = document.getElementById('micResult');
            res.innerText = "กำลังขออนุญาตใช้ไมค์...";
            log("Requesting Mic...");
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                res.innerHTML = "✅ ไมค์ใช้งานได้!";
                res.style.color = "#0f0";
                log("Mic Access Granted");
            } catch (err) {
                res.innerHTML = "❌ ไมค์พัง/ไม่อนุญาต: " + err.message;
                res.style.color = "#f00";
                log("Mic Error: " + err.message);
                
                if(err.message.includes('SSL') || err.message.includes('Permission')) {
                    alert("⚠️ ต้องเปิดเว็บผ่าน HTTPS และกดอนุญาตไมค์เท่านั้น");
                }
            }
        }
    </script>
</body>
</html>
